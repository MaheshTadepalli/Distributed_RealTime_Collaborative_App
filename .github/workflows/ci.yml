name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libpq-dev pkg-config

      - name: Configure
        run: cmake -S . -B build -DCOLLAB_WITH_POSTGRES=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build Docker image
        run: docker build -t collab-server:${{ github.sha }} .

      - name: Save image artifact
        run: docker save collab-server:${{ github.sha }} | gzip > collab-server.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: collab-server-image
          path: collab-server.tar.gz
